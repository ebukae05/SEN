# SEN — Configuration
# All configurable values for the SEN platform.
# Code must read from this file, never hardcode.

paths:
  data_raw: data/raw
  data_processed: data/processed
  models_saved: models/saved
  outputs_reports: outputs/reports
  logs: logs

data:
  active_dataset: FD001
  datasets:
    FD001:
      train: train_FD001.txt
      test: test_FD001.txt
      rul: RUL_FD001.txt
    FD002:
      train: train_FD002.txt
      test: test_FD002.txt
      rul: RUL_FD002.txt
    FD003:
      train: train_FD003.txt
      test: test_FD003.txt
      rul: RUL_FD003.txt
    FD004:
      train: train_FD004.txt
      test: test_FD004.txt
      rul: RUL_FD004.txt
  schema:
    columns:
      - unit_id
      - cycle
      - op1
      - op2
      - op3
      - s1
      - s2
      - s3
      - s4
      - s5
      - s6
      - s7
      - s8
      - s9
      - s10
      - s11
      - s12
      - s13
      - s14
      - s15
      - s16
      - s17
      - s18
      - s19
      - s20
      - s21
    id_column: unit_id
    cycle_column: cycle
    op_columns:
      - op1
      - op2
      - op3
    sensor_prefix: s
    sensor_count: 21
  processed_filename: "train_{dataset_id}_clean.csv"
  scaler_filename: "scaler_{dataset_id}.pkl"

preprocessing:
  rul_cap: 130
  scaler: minmax
  normalize_range: [0, 1]
  constant_sensor_variance_threshold: 1.0e-6
  expected_sensor_count_after_drop: 14

cdh:
  supported_formats:
    - csv
    - json
    - xlsx
  required_columns:
    - unit_id
    - cycle
  out_of_range:
    min: -1000.0
    max: 10000.0
  prioritize_by: rul_ascending

ingestion:
  custom_data_dir: data/custom
  min_sensors: 3
  min_rows_per_unit: 50
  max_upload_mb: 50
  missing_value_warn_pct: 10
  preview_sample_rows: 5
  default_tenant_id: default
  supported_industries:
    - oil_gas
    - power_generation
    - heavy_industry
    - mining
    - aerospace
    - marine
    - wind_energy
    - automotive_manufacturing
    - chemical
    - general_manufacturing
  supported_asset_types:
    - turbofan_engine
    - centrifugal_compressor
    - gas_turbine
    - steam_turbine
    - electric_motor
    - pump
    - gearbox
    - wind_turbine_drivetrain
    - conveyor_drive
    - crusher
    - generator
    - custom
  sensor_type_tags:
    - vibration
    - temperature
    - pressure
    - speed
    - current
    - flow
    - oil_quality
    - acoustic
    - humidity
    - voltage
    - custom

model:
  sequence_length: 30
  n_features: 14
  conv_filters: 64
  conv_kernel: 3
  pool_size: 2
  lstm_units: 50
  lstm_layers: 2
  dropout: 0.3
  dense_units: 1
  weights_filename: "cnn_lstm_{dataset_id}.pt"

training:
  loss: MSELoss
  optimizer: Adam
  learning_rate: 0.001
  epochs: 50
  batch_size: 32
  validation_split: 0.2
  target_rmse_min: 13
  target_rmse_max: 16
  random_seed: 42

monitoring:
  window_size: 30
  rul_alert_threshold: 50
  severity:
    critical_below: 30
    watch_below: 80

llm:
  provider: google
  model: gemini-2.5-flash
  temperature: 0.7
  max_output_tokens: 1024
  api_key_env: GOOGLE_API_KEY

api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - "*"

security:
  api_key_env: SEN_API_KEY
  api_key_header: X-API-Key
  public_endpoints:
    - /health
    - /docs
    - /openapi.json
    - /redoc

alerts:
  enabled: true
  # Severities that trigger a webhook on transition. Anything not listed here
  # only updates the in-memory log and the severity detector.
  fire_on:
    - critical
  channels:
    slack_webhook_env: SEN_SLACK_WEBHOOK
    generic_webhook_env: SEN_ALERT_WEBHOOK
  cooldown_seconds: 300
  recent_log_capacity: 100

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
